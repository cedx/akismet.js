name: ContinuousIntegration
on: push

defaults:
  run:
    shell: pwsh

jobs:
  Test:
    runs-on: windows-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install dependencies
        run: ./Invoke.ps1 Install
      - name: Run tests
        run: ./Invoke.ps1 Test
        env:
          AKISMET_API_KEY: ${{secrets.AKISMET_API_KEY}}
